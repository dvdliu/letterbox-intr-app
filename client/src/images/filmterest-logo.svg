<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- TV body -->
  <rect x="8" y="22" width="84" height="56" rx="6" fill="#0f0f0f" stroke="#e8b84b" stroke-width="3"/>

  <!-- TV screen -->
  <rect x="16" y="30" width="68" height="38" rx="3" fill="#1a1a1a" stroke="#e8b84b" stroke-width="1.5"/>

  <!-- Screen glow / content suggestion -->
  <rect x="20" y="34" width="60" height="30" rx="2" fill="#e8b84b" opacity="0.08"/>
  <line x1="20" y1="42" x2="80" y2="42" stroke="#e8b84b" stroke-width="1" opacity="0.2"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="#e8b84b" stroke-width="1" opacity="0.2"/>
  <line x1="20" y1="58" x2="80" y2="58" stroke="#e8b84b" stroke-width="1" opacity="0.2"/>

  <!-- Antenna left -->
  <line x1="35" y1="22" x2="22" y2="6" stroke="#e8b84b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="22" cy="6" r="2.5" fill="#e8b84b"/>

  <!-- Antenna right -->
  <line x1="65" y1="22" x2="78" y2="6" stroke="#e8b84b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="78" cy="6" r="2.5" fill="#e8b84b"/>

  <!-- Stand neck -->
  <rect x="44" y="78" width="12" height="8" rx="1" fill="#e8b84b"/>

  <!-- Stand base -->
  <rect x="30" y="86" width="40" height="6" rx="3" fill="#e8b84b"/>
</svg>
